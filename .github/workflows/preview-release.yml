name: Preview Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*-preview.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate preview version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain three numeric components." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] \
              && [[ ! "$GITHUB_REF_NAME" =~ ^v${version}-preview\.[0-9]+$ ]]; then
            echo "Tag must match v${version}-preview.N." >&2
            exit 1
          fi
          artifact="DockDeck-${version}-macos-universal-unsigned.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Test release build with warnings as errors
        run: swift test -c release -Xswiftc -warnings-as-errors

      - name: Build unsigned preview
        run: ./scripts/package.sh

      - name: Verify unsigned preview
        env:
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
          CHECKSUM: ${{ steps.metadata.outputs.checksum }}
        run: |
          set -euo pipefail
          test -f "$ARTIFACT"
          test -f "$CHECKSUM"
          shasum -a 256 -c "$CHECKSUM"
          codesign --verify --deep --strict .build/release-dist/DockDeck.app
          codesign -dvvv .build/release-dist/DockDeck.app 2>&1 \
            | grep -q '^Signature=adhoc$'
          codesign -d --entitlements :- .build/release-dist/DockDeck.app 2>/dev/null \
            | plutil -p - \
            | grep -Fq '"com.apple.security.automation.apple-events" => true'

      - name: Attest preview provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.metadata.outputs.artifact }}

      - name: Upload manual-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockdeck-${{ steps.metadata.outputs.version }}-unsigned-preview
          path: |
            ${{ steps.metadata.outputs.artifact }}
            ${{ steps.metadata.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged preview
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
          CHECKSUM: ${{ steps.metadata.outputs.checksum }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT" "$CHECKSUM" \
            --prerelease \
            --generate-notes \
            --title "DockDeck $VERSION Preview" \
            --notes "Unsigned technical preview. Installing from source with ./scripts/install.sh is recommended. The attached app is ad-hoc signed and not notarized, so macOS requires manual approval."
